name: 'Build macOS App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Verify project structure
        run: |
          echo "=== Project structure ==="
          ls -la
          echo "=== src-tauri structure ==="
          ls -la src-tauri || echo "src-tauri not found"
          echo "=== src structure ==="
          ls -la src || echo "src not found"
      
      - name: Install dependencies
        run: npm install
      
      - name: Verify Tauri CLI
        run: npx tauri --version
      
      - name: Build Tauri app for macOS (verbose)
        run: npx tauri build --target universal-apple-darwin --verbose
      
      - name: Check build output
        if: always()
        run: |
          echo "=== Checking build outputs ==="
          ls -R src-tauri/target/ || echo "No target directory"
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
